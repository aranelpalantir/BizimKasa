<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="#080c14"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#vaultGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>
  
  <!-- Safe Outer Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="24"/>
  <circle cx="256" cy="256" r="110" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glow)"/>
  
  <!-- Dial Notches -->
  <line x1="256" y1="126" x2="256" y2="140" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="372" x2="256" y2="386" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <line x1="126" y1="256" x2="140" y2="256" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <line x1="372" y1="256" x2="386" y2="256" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>

  <!-- Center Vault Handle / Gold Coin Symbol -->
  <circle cx="256" cy="256" r="64" fill="url(#goldGrad)"/>
  <circle cx="256" cy="256" r="50" fill="#0b0f19"/>
  
  <!-- Elegant "B" and "K" fusion or Türk Lirası/Vault star -->
  <path d="M236 216 H266 C276 216 284 223 284 233 C284 241 278 247 270 250 C280 253 286 261 286 271 C286 283 277 292 264 292 H236 Z" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="236" y1="216" x2="236" y2="292" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
  <line x1="236" y1="252" x2="264" y2="252" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- Dynamic Trend Arrow / Growth indicator -->
  <path d="M330 180 L380 180 L380 230" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M290 270 L340 220 L380 180" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>
</svg>